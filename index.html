<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Molten Steel</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #080604; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// ── Parametri calibrabili ─────────────────────────────────────────
const PUSH_STRENGTH = 0.004;   // intensità spinta UV (0.01 = sottile, 0.05 = forte)
const PUSH_RADIUS   = 18.0;    // ampiezza gaussian (basso = largo, alto = stretto)
const FIELD_DECAY   = 0.978;   // decay velocity field per frame
const FLOW_SPEED    = 0.000011; // velocità animazione base metallo

const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
if (!gl) { document.body.style.background='#1a0800'; throw new Error('No WebGL'); }

// Estensioni per framebuffer float
const extFloat = gl.getExtension('OES_texture_float');
const extHalf  = gl.getExtension('OES_texture_half_float');
gl.getExtension('OES_texture_float_linear');
gl.getExtension('OES_texture_half_float_linear');
gl.getExtension('WEBGL_color_buffer_float');
gl.getExtension('EXT_color_buffer_half_float');
let TEX_TYPE = extFloat ? gl.FLOAT : extHalf ? extHalf.HALF_FLOAT_OES : gl.UNSIGNED_BYTE;

// ── Vertex shader (shared) ────────────────────────────────────────
const VS = `
  attribute vec2 a_pos;
  varying vec2 v_uv;
  void main() { v_uv = a_pos*0.5+0.5; gl_Position = vec4(a_pos,0.0,1.0); }
`;

// ── Velocity field shader ─────────────────────────────────────────
// Accumula campo vettoriale 2D (RG = velocità xy).
// Il mouse inietta un impulso radiale verso l'esterno.
// Ogni frame il campo decade verso zero.
const FS_VELOCITY = `
  precision highp float;
  varying vec2 v_uv;
  uniform sampler2D u_prev;   // campo precedente
  uniform vec2  u_mouse;      // posizione mouse 0..1
  uniform vec2  u_dmouse;     // delta mouse questo frame (aspect-corrected)
  uniform float u_hover;
  uniform float u_decay;
  uniform float u_strength;
  uniform float u_radius;
  uniform float u_aspect;

  void main() {
    // Leggi campo precedente e decade
    vec2 prev = texture2D(u_prev, v_uv).rg * 2.0 - 1.0; // decode [0,1]->[-1,1]
    vec2 field = prev * u_decay;

    if (u_hover > 0.001) {
      vec2 p  = v_uv  * vec2(u_aspect, 1.0);
      vec2 mp = u_mouse * vec2(u_aspect, 1.0);
      vec2 delta = p - mp;
      float d2 = dot(delta, delta);
      float w  = exp(-d2 * u_radius) * u_strength * u_hover;

      // Impulso radiale: spinge il fluido via dal cursore (repulsivo)
      float len = length(delta);
      vec2 push = len > 0.0001 ? -(delta / len) * w : vec2(0.0);

      field += push;
    }

    // Encode [-1,1] -> [0,1] per storage in texture RGBA
    field = clamp(field * 0.5 + 0.5, 0.0, 1.0);
    gl_FragColor = vec4(field, 0.0, 1.0);
  }
`;

// ── Main shader ───────────────────────────────────────────────────
// Campiona il velocity field, lo integra nelle coordinate UV,
// poi valuta l'FBM sulle UV distorte.
const FS_MAIN = `
  precision highp float;
  varying vec2 v_uv;
  uniform vec2  u_res;
  uniform float u_time;
  uniform sampler2D u_vel;    // velocity field
  uniform float u_dispScale;  // scala spostamento UV

  // ── Noise / FBM ───────────────────────────────────────────────
  vec2 hash2(vec2 p) {
    p = vec2(dot(p,vec2(127.1,311.7)),dot(p,vec2(269.5,183.3)));
    return -1.0+2.0*fract(sin(p)*43758.5453);
  }
  float noise(vec2 p) {
    vec2 i=floor(p),f=fract(p),u=f*f*(3.0-2.0*f);
    return mix(mix(dot(hash2(i+vec2(0,0)),f-vec2(0,0)),
                   dot(hash2(i+vec2(1,0)),f-vec2(1,0)),u.x),
               mix(dot(hash2(i+vec2(0,1)),f-vec2(0,1)),
                   dot(hash2(i+vec2(1,1)),f-vec2(1,1)),u.x),u.y);
  }
  float fbm(vec2 p) {
    float v=0.0,a=0.5;
    mat2 rot=mat2(cos(0.5),sin(0.5),-sin(0.5),cos(0.5));
    for(int i=0;i<5;i++){v+=a*noise(p);p=rot*p*2.1;a*=0.5;}
    return v;
  }

  // ── Palette metallo ───────────────────────────────────────────
  vec3 metalPalette(float t) {
    vec3 cold=vec3(0.06,0.03,0.02), mid=vec3(0.38,0.10,0.01),
         hot =vec3(0.82,0.32,0.02), glow=vec3(0.95,0.60,0.08);
    if(t<0.45) return mix(cold,mid,t/0.45);
    if(t<0.75) return mix(mid,hot,(t-0.45)/0.30);
               return mix(hot,glow,(t-0.75)/0.25);
  }

  void main() {
    vec2 uv = gl_FragCoord.xy / u_res;
    float T = u_time * 0.000011;

    // Leggi velocity field e decode
    vec2 vel = texture2D(u_vel, uv).rg * 2.0 - 1.0;

    // Applica spostamento alle coordinate UV per FBM
    // — il metallo si "piega" nella direzione della spinta
    vec2 aspect = vec2(u_res.x/u_res.y, 1.0);
    vec2 p = uv * aspect + vel * u_dispScale;

    // FBM sulle UV distorte
    vec2 q = vec2(fbm(p+T*0.6),       fbm(p+vec2(1.7,9.2)+T*0.5));
    vec2 r = vec2(fbm(p+4.0*q+vec2(1.7,9.2)+T*0.38),
                  fbm(p+4.0*q+vec2(8.3,2.8)+T*0.32));
    float base = clamp(fbm(p+4.0*r)*1.1+0.52, 0.0, 1.0);

    // Vene di convezione
    float veins = fbm(p*2.2+vec2(T*0.9,-T*0.5));
    base = mix(base, base*0.72, (1.0-smoothstep(0.08,0.38,abs(veins)))*0.35);

    vec3 color = metalPalette(base);

    // Vignetta
    vec2 vu = uv*(1.0-uv.yx);
    color *= mix(0.22, 1.0, pow(clamp(vu.x*vu.y*16.0,0.0,1.0), 0.55));

    // Banda top per leggibilità header Board
    color *= mix(0.28, 1.0, smoothstep(0.0, 0.38, uv.y));

    // Grain cinematografico
    float g=(fract(sin(dot(gl_FragCoord.xy,vec2(12.9898,78.233)+u_time*0.01))*43758.5)-0.5)*0.016;
    gl_FragColor = vec4(clamp(color+g, 0.0, 1.0), 1.0);
  }
`;

// ── Compile ───────────────────────────────────────────────────────
function compileShader(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s));
  return s;
}
function makeProgram(fsSrc) {
  const p = gl.createProgram();
  gl.attachShader(p, compileShader(gl.VERTEX_SHADER, VS));
  gl.attachShader(p, compileShader(gl.FRAGMENT_SHADER, fsSrc));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) console.error(gl.getProgramInfoLog(p));
  return p;
}
function ul(prg, n) { return gl.getUniformLocation(prg, n); }

const velPrg  = makeProgram(FS_VELOCITY);
const mainPrg = makeProgram(FS_MAIN);

// ── Quad ──────────────────────────────────────────────────────────
const qBuf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, qBuf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,1,-1,-1,1,1,1]), gl.STATIC_DRAW);
function bindQuad(prg) {
  gl.bindBuffer(gl.ARRAY_BUFFER, qBuf);
  const loc = gl.getAttribLocation(prg,'a_pos');
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
}

// ── Ping-pong velocity field ──────────────────────────────────────
let TW=1, TH=1;
let pingTex, pongTex, pingFB, pongFB;

function makeTex(w, h) {
  const t = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,w,h,0,gl.RGBA,TEX_TYPE,null);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  return t;
}
function makeFB(tex) {
  const fb = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
  gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,tex,0);
  const ok = gl.checkFramebufferStatus(gl.FRAMEBUFFER) === gl.FRAMEBUFFER_COMPLETE;
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  if (!ok) { TEX_TYPE = gl.UNSIGNED_BYTE; return null; }
  return fb;
}
function initPP() {
  TW = Math.max(1, Math.ceil(window.innerWidth  / 3));
  TH = Math.max(1, Math.ceil(window.innerHeight / 3));
  [pingTex,pongTex,pingFB,pongFB].forEach(x => {
    if(!x) return;
    if(x.deleteTexture) gl.deleteTexture(x);
    if(x.deleteFramebuffer) gl.deleteFramebuffer(x);
  });
  pingTex = makeTex(TW,TH); pingFB = makeFB(pingTex);
  if (!pingFB) { pingTex = makeTex(TW,TH); pingFB = makeFB(pingTex); }
  pongTex = makeTex(TW,TH); pongFB = makeFB(pongTex);
}
function resize() {
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;
  gl.viewport(0,0,canvas.width,canvas.height);
  initPP();
}
resize();
window.addEventListener('resize', resize);

// ── Mouse ─────────────────────────────────────────────────────────
let mouse    = { x:0.5, y:0.5 };
let smMouse  = { x:0.5, y:0.5 };  // smoothed — evita jitter
let dmouse   = { x:0.0, y:0.0 };  // delta frame corrente
let targetHov = 0.0, hover = 0.0;

canvas.addEventListener('mousemove', e => {
  const r = canvas.getBoundingClientRect();
  mouse.x =  (e.clientX - r.left) / r.width;
  mouse.y = 1.0 - (e.clientY - r.top) / r.height;
  targetHov = 1.0;
});
canvas.addEventListener('mouseenter', () => { targetHov = 1.0; });
canvas.addEventListener('mouseleave', () => { targetHov = 0.0; });
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  const r=canvas.getBoundingClientRect(), t=e.touches[0];
  mouse.x =  (t.clientX-r.left)/r.width;
  mouse.y = 1.0-(t.clientY-r.top)/r.height;
  targetHov = 1.0;
}, { passive: false });
canvas.addEventListener('touchend', () => { targetHov = 0.0; });

const reduced   = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const startTime = performance.now();

function render(now) {
  const elapsed = reduced ? 0 : (now - startTime);
  const aspect  = canvas.width / canvas.height;

  // Smooth mouse position per evitare impulsi bruschi
  const SMOOTH = 0.18;
  dmouse.x = (mouse.x - smMouse.x) * aspect; // aspect-correct
  dmouse.y =  mouse.y - smMouse.y;
  smMouse.x += (mouse.x - smMouse.x) * SMOOTH;
  smMouse.y += (mouse.y - smMouse.y) * SMOOTH;

  hover += (targetHov - hover) * 0.09;

  // ── Pass 1: aggiorna velocity field ───────────────────────
  gl.useProgram(velPrg);
  bindQuad(velPrg);
  gl.bindFramebuffer(gl.FRAMEBUFFER, pongFB);
  gl.viewport(0, 0, TW, TH);

  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, pingTex);
  gl.uniform1i(ul(velPrg,'u_prev'),     0);
  gl.uniform2f(ul(velPrg,'u_mouse'),    smMouse.x, smMouse.y);
  gl.uniform2f(ul(velPrg,'u_dmouse'),   dmouse.x,  dmouse.y);
  gl.uniform1f(ul(velPrg,'u_hover'),    hover);
  gl.uniform1f(ul(velPrg,'u_decay'),    FIELD_DECAY);
  gl.uniform1f(ul(velPrg,'u_strength'), PUSH_STRENGTH);
  gl.uniform1f(ul(velPrg,'u_radius'),   PUSH_RADIUS);
  gl.uniform1f(ul(velPrg,'u_aspect'),   aspect);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);

  // swap ping-pong
  let tmp;
  tmp=pingTex; pingTex=pongTex; pongTex=tmp;
  tmp=pingFB;  pingFB=pongFB;   pongFB=tmp;

  // ── Pass 2: render metallo con UV distorte ─────────────────
  gl.useProgram(mainPrg);
  bindQuad(mainPrg);
  gl.viewport(0, 0, canvas.width, canvas.height);

  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, pingTex);
  gl.uniform1i(ul(mainPrg,'u_vel'),       0);
  gl.uniform2f(ul(mainPrg,'u_res'),       canvas.width, canvas.height);
  gl.uniform1f(ul(mainPrg,'u_time'),      elapsed);
  gl.uniform1f(ul(mainPrg,'u_dispScale'), 0.12);

  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  requestAnimationFrame(render);
}
requestAnimationFrame(render);
</script>
</body>
</html>
